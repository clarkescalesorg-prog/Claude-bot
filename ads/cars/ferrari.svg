<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" aria-label="Ferrari silhouette">
  <defs>
    <linearGradient id="fb" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ff5b5b"/>
      <stop offset="0.5" stop-color="#d4000a"/>
      <stop offset="1" stop-color="#5a0205"/>
    </linearGradient>
    <linearGradient id="fg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#c9e6ff"/>
      <stop offset="1" stop-color="#1a2336"/>
    </linearGradient>
  </defs>
  <ellipse cx="600" cy="475" rx="520" ry="22" fill="rgba(0,0,0,0.55)"/>
  <!-- curvy supercar body -->
  <path d="M60,410
           C120,340 240,310 330,300
           C420,240 520,200 640,190
           C780,180 880,210 980,250
           C1070,280 1130,320 1160,370
           C1170,400 1160,420 1130,420
           L80,420 Z"
        fill="url(#fb)" stroke="#2b0203" stroke-width="6" stroke-linejoin="round"/>
  <!-- glasshouse -->
  <path d="M360,280 C460,220 560,205 680,210 C780,215 860,235 900,280 C830,290 700,300 560,302 C470,303 400,295 360,280 Z"
        fill="url(#fg)"/>
  <!-- side air intake -->
  <path d="M720,340 Q820,320 900,350 Q810,375 720,365 Z" fill="#2b0203" opacity="0.7"/>
  <!-- headlight -->
  <path d="M110,360 Q180,340 220,370 Q170,380 110,380 Z" fill="#fff8d8"/>
  <!-- exhaust -->
  <circle cx="1125" cy="400" r="10" fill="#222"/>
  <circle cx="1150" cy="400" r="10" fill="#222"/>
  <!-- prancing accent stripe -->
  <rect x="580" y="200" width="18" height="180" fill="#ffe28a" opacity="0.15" transform="skewX(-18)"/>
  <!-- wheels -->
  <circle cx="310" cy="420" r="78" fill="#0a0a0a"/>
  <circle cx="310" cy="420" r="44" fill="#2e2e2e"/>
  <circle cx="310" cy="420" r="10" fill="#ffd84d"/>
  <circle cx="930" cy="420" r="78" fill="#0a0a0a"/>
  <circle cx="930" cy="420" r="44" fill="#2e2e2e"/>
  <circle cx="930" cy="420" r="10" fill="#ffd84d"/>
  <g stroke="#ccc" stroke-width="4" opacity="0.5">
    <line x1="310" y1="376" x2="310" y2="464"/>
    <line x1="266" y1="420" x2="354" y2="420"/>
    <line x1="279" y1="391" x2="341" y2="449"/>
    <line x1="341" y1="391" x2="279" y2="449"/>
    <line x1="930" y1="376" x2="930" y2="464"/>
    <line x1="886" y1="420" x2="974" y2="420"/>
    <line x1="899" y1="391" x2="961" y2="449"/>
    <line x1="961" y1="391" x2="899" y2="449"/>
  </g>
</svg>
