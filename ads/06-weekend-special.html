<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>OG Car World · Weekend Special · 1200×628</title>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<section class="ad ad-landscape bg-studio grid-lines" aria-label="Weekend special">
  <header class="brandbar">
    <div class="logo">OG<span class="accent">·</span>CAR WORLD</div>
    <div class="url">ogcarworld.co.uk</div>
  </header>

  <div class="stage" style="justify-content:flex-end; padding-right:20px;">
    <img src="cars/lambo.svg" alt="Lamborghini weekend" style="width:65%;"/>
  </div>

  <div class="headline-stack" style="left:40px; top:120px;">
    <span class="bubble white m">FRI TO MON</span>
    <span class="bubble gold xl">Weekend</span>
    <span class="bubble white xl tilt-right">in LONDON</span>
  </div>

  <div class="pricetag" style="left:40px; bottom:90px; transform:rotate(-5deg);">
    <span class="from">3 days from</span>
    <span class="amt" style="font-size:72px;">£1,299</span>
    <span class="per">all in</span>
  </div>

  <div class="cta" style="position:absolute; right:40px; bottom:40px; z-index:4;">
    Book the Weekend
  </div>
  <div style="position:absolute; right:40px; top:120px; text-align:right; z-index:4;">
    <div class="spec" style="display:inline-block;"><span class="n">UNLIMITED</span>MILES</div>
    <div class="spec" style="display:inline-block; margin-top:8px;"><span class="n">FREE</span>DELIVERY</div>
  </div>
</section>
</body>
</html>
