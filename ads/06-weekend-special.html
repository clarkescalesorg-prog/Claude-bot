<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>OG Car World · Weekend Special · 1200×628</title>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<section class="ad ad-landscape bg-studio grid-lines" aria-label="Weekend special">
  <header class="brandbar">
    <div class="logo">OG<span class="accent">·</span>CAR WORLD</div>
    <div class="url">ogcarworld.co.uk</div>
  </header>

  <div class="stage" style="justify-content:flex-end; padding-right:0; top:60px;">
    <img src="cars/lambo.svg" alt="Lamborghini weekend" style="width:55%;"/>
  </div>

  <div class="headline-stack" style="left:40px; top:100px; max-width:55%;">
    <span class="bubble white s">FRI TO MON</span>
    <span class="bubble gold l">Weekend</span>
    <span class="bubble white l tilt-right">in LONDON</span>
  </div>

  <div class="pricetag" style="left:40px; bottom:40px; transform:rotate(-5deg); padding:14px 22px;">
    <span class="from" style="font-size:16px;">3 days from</span>
    <span class="amt" style="font-size:52px;">£1,299</span>
    <span class="per" style="font-size:14px;">all in</span>
  </div>

  <div style="position:absolute; right:40px; bottom:120px; text-align:right; z-index:4;">
    <div class="spec" style="display:inline-block;"><span class="n">UNLIMITED</span>MILES</div>
    <div class="spec" style="display:inline-block; margin-top:8px;"><span class="n">FREE</span>DELIVERY</div>
  </div>

  <div class="cta" style="position:absolute; right:40px; bottom:40px; z-index:4; padding:14px 24px; font-size:18px;">
    Book the Weekend
  </div>
</section>
</body>
</html>
