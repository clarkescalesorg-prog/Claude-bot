<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>OG Car World · Mercedes-AMG GT · 1080×1080</title>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<section class="ad ad-square bg-silver grid-lines" aria-label="Mercedes AMG GT ad">
  <header class="brandbar">
    <div class="logo">OG<span class="accent">·</span>CAR WORLD</div>
    <div class="url">ogcarworld.co.uk</div>
  </header>

  <div class="stage">
    <img src="cars/merc.svg" alt="Mercedes-AMG GT"/>
  </div>

  <div class="headline-stack top-left">
    <span class="bubble white l">Now in</span>
    <span class="bubble silver xxl tilt-right">Leeds</span>
    <span class="bubble gold m">· Nationwide delivery ·</span>
  </div>

  <div class="pricetag top-right">
    <span class="from">From</span>
    <span class="amt">£349</span>
    <span class="per">per day</span>
  </div>

  <div class="specs" style="position:absolute; left:40px; bottom:220px; z-index:4;">
    <div class="spec"><span class="n">577</span>BHP</div>
    <div class="spec"><span class="n">V8</span>BI-TURBO</div>
    <div class="spec"><span class="n">AMG</span>DYNAMIC</div>
  </div>

  <footer class="footer">
    <div>
      <div style="font-family:'Bungee'; font-size:28px; margin-bottom:8px;">
        MERCEDES-AMG · GT 63 S
      </div>
      <div class="cta">Enquire Now</div>
    </div>
    <div class="smallprint">
      Self-drive or chauffeured<br/>
      Weddings · events · experiences
    </div>
  </footer>
</section>
</body>
</html>
