<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>OG Car World · Weddings & Prom · 1080×1080</title>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<section class="ad ad-square bg-silver grid-lines" aria-label="Wedding and prom hire">
  <header class="brandbar">
    <div class="logo">OG<span class="accent">·</span>CAR WORLD</div>
    <div class="url">ogcarworld.co.uk</div>
  </header>

  <div class="stage">
    <img src="cars/merc.svg" alt="Mercedes AMG for events"/>
  </div>

  <div class="headline-stack" style="left:40px; top:110px; max-width:92%;">
    <span class="bubble white s">FOR YOUR BIG DAY</span>
    <span class="bubble gold xl">Weddings</span>
    <span class="bubble white m tilt-right">&amp; Prom Night</span>
  </div>

  <div class="pricetag bottom-right">
    <span class="from">Packages from</span>
    <span class="amt" style="font-size:64px;">£450</span>
    <span class="per">per event</span>
  </div>

  <div class="specs" style="position:absolute; left:40px; bottom:220px; z-index:4;">
    <div class="spec"><span class="n">✓</span>CHAUFFEUR</div>
    <div class="spec"><span class="n">✓</span>RIBBONS</div>
    <div class="spec"><span class="n">✓</span>PHOTOS</div>
  </div>

  <footer class="footer">
    <div>
      <div style="font-family:'Bungee'; font-size:26px; margin-bottom:8px;">
        ARRIVE IN STYLE
      </div>
      <div class="cta">Book Your Date</div>
    </div>
    <div class="smallprint">
      Unit 7, Hainault Business Park, IG6 3XH, London<br/>
      Mercedes · BMW · Ferrari · Lamborghini
    </div>
  </footer>
</section>
</body>
</html>
