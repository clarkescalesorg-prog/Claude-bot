<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>OG Car World · The Fleet · 1080×1080</title>
<link rel="stylesheet" href="styles.css"/>
<style>
  .fleet-grid {
    position: absolute;
    inset: 200px 40px 220px 40px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 18px;
    z-index: 2;
  }
  .fleet-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 14px;
    padding: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .fleet-card img { width: 100%; filter: drop-shadow(0 20px 20px rgba(0,0,0,0.5)); }
  .fleet-card .tag {
    position: absolute;
    bottom: 10px; left: 12px;
    font-family: 'Bungee', cursive;
    font-size: 18px;
    letter-spacing: 2px;
    color: #fff;
    background: rgba(0,0,0,0.55);
    padding: 6px 12px;
    border-radius: 999px;
  }
</style>
</head>
<body>
<section class="ad ad-square bg-night grid-lines" aria-label="Fleet showcase">
  <header class="brandbar">
    <div class="logo">OG<span class="accent">·</span>CAR WORLD</div>
    <div class="url">ogcarworld.co.uk</div>
  </header>

  <div class="headline-stack top-left">
    <span class="bubble white l">The Fleet</span>
    <span class="bubble gold xxl tilt-right">LONDON</span>
    <span class="bubble white m">· Delivered UK wide ·</span>
  </div>

  <div class="pricetag top-right">
    <span class="from">From</span>
    <span class="amt">£199</span>
    <span class="per">/ day</span>
  </div>

  <div class="fleet-grid">
    <div class="fleet-card"><img src="cars/lambo.svg" alt="Lamborghini"/><span class="tag">LAMBO · HURACÁN</span></div>
    <div class="fleet-card"><img src="cars/ferrari.svg" alt="Ferrari"/><span class="tag">FERRARI · 488</span></div>
    <div class="fleet-card"><img src="cars/bmw.svg" alt="BMW M4"/><span class="tag">BMW · M4 COMP</span></div>
    <div class="fleet-card"><img src="cars/merc.svg" alt="Mercedes AMG"/><span class="tag">MERCEDES · AMG GT</span></div>
  </div>

  <footer class="footer">
    <div>
      <div style="font-family:'Bungee'; font-size:26px; margin-bottom:8px;">
        SUPERCAR HIRE · UK
      </div>
      <div class="cta">See the Full Fleet</div>
    </div>
    <div class="smallprint">
      30+ prestige vehicles · insured &amp; delivered<br/>
      Book online in under 60 seconds
    </div>
  </footer>
</section>
</body>
</html>
