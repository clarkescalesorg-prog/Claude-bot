<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>OG Car World · Ferrari 488 · 1080×1080</title>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<section class="ad ad-square bg-red grid-lines" aria-label="Ferrari 488 ad">
  <header class="brandbar">
    <div class="logo">OG<span class="accent">·</span>CAR WORLD</div>
    <div class="url">ogcarworld.co.uk</div>
  </header>

  <div class="stage">
    <img src="cars/ferrari.svg" alt="Ferrari 488"/>
  </div>

  <div class="headline-stack" style="right:40px; top:120px; align-items:flex-end; text-align:right; max-width:90%;">
    <span class="bubble white l">Hire in</span>
    <span class="bubble gold xl">Manchester</span>
    <span class="bubble white s">· UK WIDE DELIVERY ·</span>
  </div>

  <div class="pricetag" style="left:40px; bottom:180px; transform:rotate(-8deg);">
    <span class="from">From just</span>
    <span class="amt">£599</span>
    <span class="per">per day</span>
  </div>

  <div class="specs" style="position:absolute; right:40px; bottom:220px; z-index:4;">
    <div class="spec"><span class="n">661</span>BHP</div>
    <div class="spec"><span class="n">V8</span>TWIN-TURBO</div>
    <div class="spec"><span class="n">205</span>MPH</div>
  </div>

  <footer class="footer">
    <div>
      <div style="font-family:'Bungee'; font-size:28px; margin-bottom:8px;">
        FERRARI · 488 GTB
      </div>
      <div class="cta white">Reserve Yours</div>
    </div>
    <div class="smallprint">
      Prestige hire · chauffeur &amp; self-drive<br/>
      Weekend and weekly packages available
    </div>
  </footer>
</section>
</body>
</html>
