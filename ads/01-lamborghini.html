<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>OG Car World · Lamborghini Huracán · 1080×1080</title>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<section class="ad ad-square bg-studio grid-lines" aria-label="Lamborghini Huracán ad">
  <header class="brandbar">
    <div class="logo">OG<span class="accent">·</span>CAR WORLD</div>
    <div class="url">ogcarworld.co.uk</div>
  </header>

  <div class="stage">
    <img src="cars/lambo.svg" alt="Lamborghini Huracán"/>
  </div>

  <!-- Location + price in bubble-writing headline -->
  <div class="headline-stack" style="left:40px; top:110px; max-width:92%;">
    <span class="bubble gold l">Based in</span>
    <span class="bubble white xl tilt-right">HAINAULT</span>
    <span class="bubble gold s">IG6 3XH · LONDON</span>
  </div>

  <div class="pricetag bottom-right">
    <span class="from">From only</span>
    <span class="amt">£499</span>
    <span class="per">/ day</span>
  </div>

  <div class="specs" style="position:absolute; left:40px; bottom:220px; z-index:4;">
    <div class="spec"><span class="n">631</span>BHP</div>
    <div class="spec"><span class="n">0–60</span>2.9s</div>
    <div class="spec"><span class="n">V10</span>AWD</div>
  </div>

  <footer class="footer">
    <div>
      <div style="font-family:'Bungee'; font-size:28px; margin-bottom:8px;">
        LAMBORGHINI · HURACÁN
      </div>
      <div class="cta">Book Online</div>
    </div>
    <div class="smallprint">
      Unit 7, Hainault Business Park, IG6 3XH, London<br/>
      Self-drive hire · 25+ drivers · fully insured
    </div>
  </footer>
</section>
</body>
</html>
