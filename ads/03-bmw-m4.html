<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>OG Car World · BMW M4 Competition · 1200×628</title>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<section class="ad ad-landscape bg-blue grid-lines" aria-label="BMW M4 ad">
  <header class="brandbar">
    <div class="logo">OG<span class="accent">·</span>CAR WORLD</div>
    <div class="url">ogcarworld.co.uk</div>
  </header>

  <div class="stage" style="justify-content:flex-end; padding-right:20px;">
    <img src="cars/bmw.svg" alt="BMW M4 Competition" style="width:70%;"/>
  </div>

  <div class="headline-stack" style="left:40px; top:130px;">
    <span class="bubble white l">Drive the</span>
    <span class="bubble blue xl tilt-right">M4 COMP</span>
    <span class="bubble gold m">in Birmingham</span>
  </div>

  <div class="pricetag" style="left:40px; bottom:120px; transform:rotate(-4deg); padding:18px 24px;">
    <span class="from">From</span>
    <span class="amt" style="font-size:64px;">£249</span>
    <span class="per">/ day</span>
  </div>

  <div class="specs" style="position:absolute; right:40px; bottom:40px; z-index:4;">
    <div class="spec"><span class="n">510</span>BHP</div>
    <div class="spec"><span class="n">0–60</span>3.5s</div>
    <div class="spec"><span class="n">M-XDRIVE</span></div>
  </div>

  <div class="cta" style="position:absolute; right:40px; top:130px; padding:14px 22px; font-size:18px; z-index:4;">
    Book Online
  </div>
</section>
</body>
</html>
